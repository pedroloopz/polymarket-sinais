name: Descobrir chat ID

# Rode manualmente DEPOIS de mandar qualquer mensagem ao seu bot no Telegram.
# O chat ID aparece no resumo da execução (aba Summary).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  descobrir:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
    steps:
      - name: Ler as últimas mensagens do bot
        run: |
          [ -z "$TELEGRAM_BOT_TOKEN" ] && { echo "::error::Cadastre o Secret TELEGRAM_BOT_TOKEN primeiro."; exit 1; }
          info=$(curl -s "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/getWebhookInfo")
          if [ -n "$(echo "$info" | jq -r '.result.url // empty')" ]; then
            echo "O webhook do Worker já está ligado: mande /start ao bot que ele responde com o seu chat ID." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          r=$(curl -s "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/getUpdates")
          echo "$r" | jq -e '.ok' > /dev/null || { echo "::error::Token inválido: $(echo "$r" | jq -r '.description')"; exit 1; }
          {
            echo "### Chats que falaram com o bot"
            echo "$r" | jq -r '[.result[] | (.message // .edited_message // .callback_query.message) | select(.) | .chat]
              | unique_by(.id) | .[] | "- **\(.id)** — \(.first_name // .title // "") \(.username // "")"'
            echo
            echo "Copie o número do seu nome para o Secret **TELEGRAM_CHAT_ID**."
          } | tee -a "$GITHUB_STEP_SUMMARY"
