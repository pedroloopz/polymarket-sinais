# Todos os limiares do bot. Nada fica fixo no código.
# Os valores marcados "(Telegram)" podem ser alterados pelo próprio Telegram;
# o valor do Telegram (guardado no Cloudflare KV) tem prioridade sobre este arquivo.

fuso: "America/Sao_Paulo"

coleta:
  resultados_por_busca: 20        # limit_per_type da busca da Gamma
  max_mercados_por_tema: 40
  ignorar_mercados_fechados: true
  lote_midpoints: 50              # tokens por chamada POST /midpoints
  pausa_entre_chamadas_s: 0.3     # gentileza com a API (a doc de limites estava inacessível na criação)

filtros:
  volume_min_sinal_usd: 1000000   # (Telegram) abaixo disso, só monitora
  volume_min_exibir_usd: 50000    # abaixo disso, nem aparece no resumo
  mercados_por_tema_resumo: 2

novos:
  idade_max_dias: 7               # só avisa mercado criado há até N dias (evita falso "novo")

prazos:
  dias_vencendo: 3

silencio:                         # (Telegram) só 🚨 toca neste intervalo
  ligado: true
  inicio: "22:00"
  fim: "07:00"

balancos:
  reacoes_historicas: 8
  contagem_regressiva_dias: 10

diario:
  custo_estimado_pct: 0.2         # custo ida+volta descontado de cada operação simulada (%)
  horizontes: ["1h", "1d", "1w"]
  minimo_sinais_avaliados: 30
  minimo_semanas: 8

# ---- Fase 2 ----
calibracao:                       # módulo 2 (workflow mensal "Calibração")
  intervalo_min: 5                # menor barra que o Yahoo dá para 30+ dias (1 min só vale 7 dias)
  dias: 30
  defasagem_max_min: 60           # testa de −60 a +60 min
  mercados_por_tema: 3            # os de maior volume (acima do volume mínimo de sinal)
  amostras_min: 150               # barras alinhadas mínimas para confiar no par
  t_min: 3.3                      # |t| mínimo do beta. 3,3 = Bonferroni p/ 25 defasagens testadas
                                  # (com 2,0, 77 de 100 pares "passavam" na 1ª calibração real: falso positivo)

sinais:
  zscore_min: 2.0                 # (Telegram)
  janela_desvio_dias: 30
  persistencia_leituras: 2        # o movimento precisa aparecer em N leituras seguidas
  retencao_min: 0.5               # na leitura seguinte, precisa manter ≥ 50% do movimento
  prefiltro_pp: 1.0               # abaixo de 1 p.p. em 1 h nem calcula z (economiza chamadas)
  zona_distorcida: {abaixo: 0.10, acima: 0.90}
  prazo_curto_dias: 3
  prazo_curto_fator_z: 1.5        # queda em mercado "até dd/mm" perto do fim exige z × 1,5
  espaco_minimo_pct_do_esperado: 50
  latencia_multiplo: 3            # acionável só se defasagem > 3 × latência do alerta

semaforo:
  limiar_pct: 0.1                 # indicador precisa andar ≥ 0,1% para contar

risco:
  risco_por_operacao_pct: 1.0     # (Telegram)
  atr_dias: 14
  atr_multiplo_stop: 1.5
  ganho_risco_min: 1.5            # (Telegram)
  stop_tempo_multiplo_defasagem: 2
  invalidacao_devolucao: 0.5      # prob. devolve > 50% do movimento → "sinal invalidado"
  capital: null                   # (Telegram) /capital — nunca vai para o git

protecao:
  perdas_seguidas_para_pausar: 2
  pausa_horas: 24

# ---- Fase 3 ----
tempo_real:                       # Worker do Cloudflare a cada 5 min
  mercados: 25                    # mercados prioritários vigiados (os de maior volume)
  janelas_min: [15, 30, 60]       # compara a leitura atual com 15, 30 e 60 min atrás

manipulacao:                      # módulo 5
  concentracao_top5: 0.6
  divergencia_pp: 5
  movimento_pp: 3
  volume_baixo_usd: 50000
  liquidez_rasa_usd: 20000
  reversao_pp: 5
  pico_noticias_min: 1.5          # GDELT: volume recente ÷ mediana da semana

kalshi:
  paginas: 15                     # páginas de 200 eventos abertos
  similaridade_min: 0.45          # casamento conservador de perguntas

x:                                # módulo 14 — posts para o X (Fase 4)
  perfil: "@pedroloopz"           # marca d'água dos gráficos
  horarios: ["08:30", "10:20", "18:30"]   # rascunhos do Termômetro do Caos (Brasília)
  modelo: "claude-opus-5-5"       # Claude que escreve; "claude-sonnet-5-5" custa metade
  effort: "low"                   # textos curtos: esforço baixo basta e sai mais barato
  virada_z_min: 3                 # alerta de virada quando |z| ≥ 3
  fio_min_pp: 15                  # fio quando um mercado líquido anda ≥ 15 p.p. em 24 h
  liquidez_min_diaria: 5000000    # ativo com menos que isso (volume financeiro/dia) nunca entra em post

baleias:                          # módulo 6
  minimo_resolvidos: 20
  candidatas: 60
  mercados_amostra: 30
  top: 20
  alerta_minimo_usd: 5000
  alerta_aumento_pct: 20
