# Ativos ligados aos temas.
# temas: {tema: sentido} — reação esperada quando a probabilidade do evento do tema SOBE.
#   +1 = ativo sobe | -1 = ativo cai | 0 = sentido desconhecido (definido só pela calibração).
# É hipótese inicial: a calibração (Fase 2, módulo 2) substitui pelo valor medido.
# pregao: fuso e horário local da bolsa (usado para separar movimento em pregão de gap de abertura).
# A B3 muda o horário quando os EUA entram/saem do horário de verão; confira em b3.com.br.

pregoes:
  EUA: {fuso: "America/New_York", abre: "09:30", fecha: "16:00", moeda: USD}
  B3: {fuso: "America/Sao_Paulo", abre: "10:00", fecha: "17:00", moeda: BRL}
  FUT: {fuso: "America/New_York", abre: "00:00", fecha: "23:59", moeda: USD}
  CRIPTO: {fuso: "UTC", abre: "00:00", fecha: "23:59", moeda: USD}

