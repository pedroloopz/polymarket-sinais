[project]
name = "polymarket-sinais"
version = "0.1.0"
description = "Bot de sinais (somente leitura): mercados de previsão → ações B3/EUA, alertas no Telegram"
requires-python = ">=3.12"
dependencies = [
    "requests==2.34.2",
    "pyyaml==6.0.3",
    "yfinance==1.7.0",
    "pandas==3.0.6",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.10",
]

[project.scripts]
bot = "bot.main:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
